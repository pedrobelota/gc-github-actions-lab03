name: Lab 03 - Exercício 02 - Docker Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Preparar demonstração
        run: sleep 35
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: pedro-belota/gc-github-actions-lab03:latest
          outputs: type=docker,dest=/tmp/lab03-image.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab03-docker-image
          path: /tmp/lab03-image.tar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Fazendo deploy
        run: echo "Deploy com sucesso!"
